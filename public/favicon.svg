<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!--
    Sudoku Game – favicon / app icon
    Grid: 9×9, cells of 10px, from (5,5) to (95,95)
    Box borders at x=35, x=65, y=35, y=65
    Colors match src/index.css CSS variables
  -->
  <defs>
    <!-- clip the grid content to a slightly rounded rect -->
    <clipPath id="grid-clip">
      <rect x="5" y="5" width="90" height="90" rx="4"/>
    </clipPath>
  </defs>

  <!-- ── Outer background ── -->
  <rect width="100" height="100" rx="18" fill="#1e3a5f"/>

  <g clip-path="url(#grid-clip)">
    <!-- ── Alternating 3×3 box backgrounds (checkerboard) ── -->
    <!-- light boxes: (0,0) (0,2) (1,1) (2,0) (2,2) -->
    <rect x="5"  y="5"  width="30" height="30" fill="#eff6ff"/>
    <rect x="65" y="5"  width="30" height="30" fill="#eff6ff"/>
    <rect x="35" y="35" width="30" height="30" fill="#eff6ff"/>
    <rect x="5"  y="65" width="30" height="30" fill="#eff6ff"/>
    <rect x="65" y="65" width="30" height="30" fill="#eff6ff"/>
    <!-- white boxes: (0,1) (1,0) (1,2) (2,1) -->
    <rect x="35" y="5"  width="30" height="30" fill="#ffffff"/>
    <rect x="5"  y="35" width="30" height="30" fill="#ffffff"/>
    <rect x="65" y="35" width="30" height="30" fill="#ffffff"/>
    <rect x="35" y="65" width="30" height="30" fill="#ffffff"/>

    <!-- ── Colored cells with numbers ──
         cell [r][c] → rect x=5+c×10, y=5+r×10, 10×10
         text center  → x=10+c×10,   y=10+r×10
    -->
    <!-- [0][0]="5"  primary blue -->
    <rect x="5"  y="5"  width="10" height="10" fill="#3b82f6"/>
    <!-- [0][6]="3"  primary blue -->
    <rect x="65" y="5"  width="10" height="10" fill="#3b82f6"/>
    <!-- [1][4]="6"  primary blue -->
    <rect x="45" y="15" width="10" height="10" fill="#3b82f6"/>
    <!-- [2][8]="7"  primary blue -->
    <rect x="85" y="25" width="10" height="10" fill="#3b82f6"/>
    <!-- [3][1]="4"  primary blue -->
    <rect x="15" y="35" width="10" height="10" fill="#3b82f6"/>
    <!-- [4][4]="9"  selected (accent) -->
    <rect x="45" y="45" width="10" height="10" fill="#93c5fd"/>
    <!-- [5][7]="2"  primary blue -->
    <rect x="75" y="55" width="10" height="10" fill="#3b82f6"/>
    <!-- [6][2]="1"  primary blue -->
    <rect x="25" y="65" width="10" height="10" fill="#3b82f6"/>
    <!-- [7][5]="8"  primary blue -->
    <rect x="55" y="75" width="10" height="10" fill="#3b82f6"/>
    <!-- [8][8]="5"  primary blue -->
    <rect x="85" y="85" width="10" height="10" fill="#3b82f6"/>

    <!-- ── Thin inner cell borders ── -->
    <line x1="15" y1="5"  x2="15" y2="95" stroke="#bfdbfe" stroke-width="0.5"/>
    <line x1="25" y1="5"  x2="25" y2="95" stroke="#bfdbfe" stroke-width="0.5"/>
    <line x1="45" y1="5"  x2="45" y2="95" stroke="#bfdbfe" stroke-width="0.5"/>
    <line x1="55" y1="5"  x2="55" y2="95" stroke="#bfdbfe" stroke-width="0.5"/>
    <line x1="75" y1="5"  x2="75" y2="95" stroke="#bfdbfe" stroke-width="0.5"/>
    <line x1="85" y1="5"  x2="85" y2="95" stroke="#bfdbfe" stroke-width="0.5"/>
    <line x1="5"  y1="15" x2="95" y2="15" stroke="#bfdbfe" stroke-width="0.5"/>
    <line x1="5"  y1="25" x2="95" y2="25" stroke="#bfdbfe" stroke-width="0.5"/>
    <line x1="5"  y1="45" x2="95" y2="45" stroke="#bfdbfe" stroke-width="0.5"/>
    <line x1="5"  y1="55" x2="95" y2="55" stroke="#bfdbfe" stroke-width="0.5"/>
    <line x1="5"  y1="75" x2="95" y2="75" stroke="#bfdbfe" stroke-width="0.5"/>
    <line x1="5"  y1="85" x2="95" y2="85" stroke="#bfdbfe" stroke-width="0.5"/>

    <!-- ── Thick 3×3 box borders ── -->
    <line x1="35" y1="5"  x2="35" y2="95" stroke="#3b82f6" stroke-width="2"/>
    <line x1="65" y1="5"  x2="65" y2="95" stroke="#3b82f6" stroke-width="2"/>
    <line x1="5"  y1="35" x2="95" y2="35" stroke="#3b82f6" stroke-width="2"/>
    <line x1="5"  y1="65" x2="95" y2="65" stroke="#3b82f6" stroke-width="2"/>

    <!-- ── Numbers ── -->
    <text x="10" y="10" text-anchor="middle" dominant-baseline="central" font-family="Arial,sans-serif" font-size="7" font-weight="bold" fill="#ffffff">5</text>
    <text x="70" y="10" text-anchor="middle" dominant-baseline="central" font-family="Arial,sans-serif" font-size="7" font-weight="bold" fill="#ffffff">3</text>
    <text x="50" y="20" text-anchor="middle" dominant-baseline="central" font-family="Arial,sans-serif" font-size="7" font-weight="bold" fill="#ffffff">6</text>
    <text x="90" y="30" text-anchor="middle" dominant-baseline="central" font-family="Arial,sans-serif" font-size="7" font-weight="bold" fill="#ffffff">7</text>
    <text x="20" y="40" text-anchor="middle" dominant-baseline="central" font-family="Arial,sans-serif" font-size="7" font-weight="bold" fill="#ffffff">4</text>
    <text x="50" y="50" text-anchor="middle" dominant-baseline="central" font-family="Arial,sans-serif" font-size="7" font-weight="bold" fill="#1e3a5f">9</text>
    <text x="80" y="60" text-anchor="middle" dominant-baseline="central" font-family="Arial,sans-serif" font-size="7" font-weight="bold" fill="#ffffff">2</text>
    <text x="30" y="70" text-anchor="middle" dominant-baseline="central" font-family="Arial,sans-serif" font-size="7" font-weight="bold" fill="#ffffff">1</text>
    <text x="60" y="80" text-anchor="middle" dominant-baseline="central" font-family="Arial,sans-serif" font-size="7" font-weight="bold" fill="#ffffff">8</text>
    <text x="90" y="90" text-anchor="middle" dominant-baseline="central" font-family="Arial,sans-serif" font-size="7" font-weight="bold" fill="#ffffff">5</text>
  </g>
</svg>
